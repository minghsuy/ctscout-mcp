name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
  id-token: write
  actions: read

jobs:
  claude:
    uses: minghsuy/dgx-infra/.github/workflows/claude-responder.yml@514c15797d04d700dd13e3c06a7a85b45dab3926
    with:
      runs-on: '"ubuntu-latest"'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

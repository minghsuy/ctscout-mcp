name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: write
  statuses: write
  id-token: write
  actions: read

jobs:
  claude:
    uses: minghsuy/dgx-infra/.github/workflows/claude-responder.yml@51b8c2c617b08974982c90a73ecad1fa77de137d
    with:
      runs-on: '"ubuntu-latest"'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    uses: minghsuy/dgx-infra/.github/workflows/claude-review-bridge.yml@51b8c2c617b08974982c90a73ecad1fa77de137d
    with:
      runs-on: '"ubuntu-latest"'
    secrets:
      BRIDGE_PAT: ${{ secrets.BRIDGE_PAT }}
